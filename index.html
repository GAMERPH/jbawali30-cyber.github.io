<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GAMEPH | Download Hub</title>
  <meta name="description" content="GAMEPH game download hub with catalog cards and direct game links." />
  <style>
    :root {
      --bg: #090b11;
      --bg-2: #1a0a0a;
      --panel: rgba(22, 21, 24, 0.7);
      --panel-strong: rgba(17, 17, 18, 0.9);
      --line: rgba(255,255,255,0.15);
      --text: #f6f4f2;
      --muted: #d0c8c1;
      --gold: #f0d78d;
      --gold-2: #d5a34d;
      --red: #7a0b0b;
      --red-2: #b30d0d;
      --red-3: #d91e1e;
      --shadow: rgba(0,0,0,0.35);
      --glow: rgba(182, 22, 22, 0.55);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 10%, rgba(141,24,24,0.3), transparent 30%),
        radial-gradient(circle at 20% 80%, rgba(138, 22, 22, 0.22), transparent 30%),
        linear-gradient(180deg, #0d0d10, #090b11 60%, #111111 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          135deg,
          rgba(255,255,255,0.015) 0,
          rgba(255,255,255,0.015) 2px,
          transparent 2px,
          transparent 18px
        );
      opacity: 0.5;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 30%, rgba(124, 14, 14, 0.18), transparent 18%),
        radial-gradient(circle at 70% 40%, rgba(153, 24, 24, 0.18), transparent 20%),
        radial-gradient(circle at 40% 80%, rgba(153, 24, 24, 0.16), transparent 18%);
      mix-blend-mode: screen;
    }

    a { text-decoration: none; color: inherit; }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 22px 18px 60px;
      position: relative;
      z-index: 1;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px 18px;
      align-items: end;
      margin-top: 10px;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      min-height: 250px;
      position: relative;
    }

    .poster {
      height: 250px;
      border-radius: 10px 10px 0 0;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.38);
      border: 1px solid rgba(255,255,255,0.12);
      position: relative;
      overflow: hidden;
    }

    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.18));
    }

    .title-link {
      display: block;
      width: 100%;
      background: rgba(0,0,0,0.42);
      border: 1px solid rgba(255,255,255,0.38);
      border-radius: 0 0 10px 10px;
      padding: 11px 12px;
      color: var(--text);
      font-weight: 800;
      font-size: 15px;
      line-height: 1.2;
      text-align: center;
      backdrop-filter: blur(2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      transition: 0.2s ease;
      text-transform: none;
    }

    .title-link:hover {
      background: rgba(0,0,0,0.6);
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-1px);
    }

    .name-button {
      display: block;
      text-align: center;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.45);
      color: var(--text);
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.02em;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: space-between;
      margin: 8px 0 20px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 240px;
      display: flex;
      justify-content: center;
    }

    .search {
      width: min(100%, 440px);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(17,19,24,0.8);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 8px 0 20px;
    }

    .filter {
      background: rgba(17,19,24,0.72);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .filter.active,
    .filter:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.4);
    }

    @media (max-width: 760px) {
      .page { padding-left: 12px; padding-right: 12px; }
      .catalog { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
      .poster { height: 220px; }
      .title-link { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="search-wrap">
        <input id="search" class="search" type="text" placeholder="Search games..." />

        <a class="title-link" href="https://example.com/alan-wake-2.zip" target="_blank">Alan Wake 2</a>

      <article class="game-card" data-category="windows" data-search="a way out co-op action adventure">
        <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80');"></div>
        <a class="title-link" href="https://example.com/a-way-out.zip" target="_blank">A Way Out</a>

        <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?auto=format&fit=crop&w=900&q=80');"></div>

      </article>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('search');
    const filterButtons = [...document.querySelectorAll('.filter')];
    const cards = [...document.querySelectorAll('.game-card')];
    let currentFilter = 'all';

    function applyFilters() {
      const term = searchInput.value.trim().toLowerCase();

      cards.forEach(card => {
        const belongs = currentFilter === 'all' || card.dataset.category === currentFilter;
        const matches = !term || (card.dataset.search + ' ' + card.textContent).toLowerCase().includes(term);
        card.style.display = belongs && matches ? 'flex' : 'none';
      });
    }

    searchInput.addEventListener('input', applyFilters);

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach(btn => btn.classList.toggle('active', btn === button));
        applyFilters();
      });
    });
  </script>
</body>
</html>
